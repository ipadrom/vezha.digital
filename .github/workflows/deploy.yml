name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/vezha.digital"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR" 2>/dev/null || sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R "$USER:$USER" "$DEPLOY_DIR" 2>/dev/null || true
            fi

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              if [ "$(find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
                echo "$DEPLOY_DIR exists but is not a git repository"
                exit 1
              fi

              git clone "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push -m "pre-deploy-${{ github.sha }}"
            fi

            git fetch origin main
            git checkout -B main origin/main

            ENV_FILE=""
            if [ -f .env ]; then
              ENV_FILE=".env"
            elif [ -f .env.prod ]; then
              ENV_FILE=".env.prod"
            fi

            if [ -z "$ENV_FILE" ]; then
              echo ".env or .env.prod is missing in $DEPLOY_DIR"
              exit 1
            fi

            if [ ! -f backend/.env.production ]; then
              echo "backend/.env.production is missing in $DEPLOY_DIR"
              exit 1
            fi

            tr -d '\r' < "$ENV_FILE" > .env.deploy

            docker compose --env-file .env.deploy -f docker-compose.prod.yml build
            docker compose --env-file .env.deploy -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file .env.deploy -f docker-compose.prod.yml exec -T vezha-backend uv run alembic upgrade head
