<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vezha Digital Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1000px;
    height: 1000px;
    background: #0a0a0a;
    overflow: hidden;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-decoration: none;
    line-height: 1;
    white-space: nowrap;
  }

  .logo__script {
    font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
    font-size: 10rem;
    font-weight: 400;
    color: #ffffff;
    font-style: italic;
    letter-spacing: 10px;
    line-height: 1;
  }

  .logo__digital {
    font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
    font-size: 3.75rem;
    font-weight: 700;
    letter-spacing: 30px;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1;
  }

  /* Glitch effect */
  .glitch {
    position: relative;
    display: inline-block;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .glitch::before {
    left: 4px;
    text-shadow: -2px 0 #ff00c1;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%, 0 60%, 100% 60%, 100% 100%, 0 100%);
    animation: glitch-anim 5s infinite linear alternate-reverse;
  }

  .glitch::after {
    left: -3px;
    text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
    clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%, 0 50%, 100% 50%, 100% 100%, 0 100%);
    animation: glitch-anim 3s infinite linear alternate-reverse;
  }

  .logo__script.glitch::before,
  .logo__script.glitch::after {
    font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
    font-size: 10rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 10px;
    line-height: 1;
  }

  .logo__digital.glitch::before,
  .logo__digital.glitch::after {
    font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
    font-size: 3.75rem;
    font-weight: 700;
    letter-spacing: 30px;
    text-transform: uppercase;
    line-height: 1;
  }

  @keyframes glitch-anim {
    0% {
      text-shadow: 0.05em 0 0 #00fffc, -0.05em -0.025em 0 #fc00ff, -0.025em 0.05em 0 #fffc00;
    }
    14% {
      text-shadow: 0.05em 0 0 #00fffc, -0.05em -0.025em 0 #fc00ff, -0.025em 0.05em 0 #fffc00;
    }
    15% {
      text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.025em 0 #fc00ff, -0.05em -0.05em 0 #fffc00;
    }
    29% {
      text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.025em 0 #fc00ff, -0.05em -0.05em 0 #fffc00;
    }
    30% {
      text-shadow: 0.025em 0.05em 0 #00fffc, 0.05em 0 0 #fc00ff, 0 -0.05em 0 #fffc00;
    }
    44% {
      text-shadow: 0.025em 0.05em 0 #00fffc, 0.05em 0 0 #fc00ff, 0 -0.05em 0 #fffc00;
    }
    45% {
      text-shadow: 0.05em 0 0 #00fffc, -0.05em -0.025em 0 #fc00ff, -0.025em 0.05em 0 #fffc00;
    }
    100% {
      text-shadow: 0.05em 0 0 #00fffc, -0.05em -0.025em 0 #fc00ff, -0.025em 0.05em 0 #fffc00;
    }
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="logo__script glitch" data-text="Vezha">Vezha</span>
    <span class="logo__digital glitch" data-text="DIGITAL">DIGITAL</span>
  </div>
</body>
</html>
