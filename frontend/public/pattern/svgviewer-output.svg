<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" overflow="visible" style="background:#060610">

  <!-- Lines -->
  <line x1="80"  y1="190" x2="250"  y2="100" stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="250" y1="100" x2="410"  y2="210" stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="410" y1="210" x2="550"  y2="90"  stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="550" y1="90"  x2="710"  y2="200" stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="710" y1="200" x2="870"  y2="95"  stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="870" y1="95"  x2="1030" y2="185" stroke="#00E5FF" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
