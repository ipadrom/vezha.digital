services:
  backend:
    build: ./backend
    container_name: vezha2-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000,https://vezha.digital
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-vezha-uploads}
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9002
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8001:8000"
    depends_on:
      - db
      - minio

  frontend:
    build: ./frontend
    container_name: vezha2-frontend
    restart: unless-stopped
    environment:
      - NUXT_PUBLIC_API_URL=http://localhost:8001
      - NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
    ports:
      - "3001:3000"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: vezha2-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vezha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vezha}
      - POSTGRES_DB=${POSTGRES_DB:-vezha}
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  minio:
    image: minio/minio:latest
    container_name: vezha2-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data2:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"

volumes:
  postgres_data2:
  minio_data2:
